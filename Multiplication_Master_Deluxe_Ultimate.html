<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiplication Master Deluxe Ultimate</title>
<style>
body{font-family:Arial;margin:0;padding:20px;background:#4facfe;color:#222}
.card{max-width:1000px;margin:auto;background:#fff;border-radius:16px;padding:20px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
label{padding:6px 10px;background:#eef;border-radius:8px}
.hidden{display:none}
.question{font-size:48px;text-align:center;margin:20px}
.stats{display:flex;gap:15px;flex-wrap:wrap;font-weight:bold}
.progress{height:20px;background:#ddd;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:#4caf50}
button{padding:10px 16px;margin:4px}
.mastery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mastery div{background:#f5f5f5;padding:8px;border-radius:8px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>🚀 Multiplication Master Deluxe Ultimate</h1>

<div id="setup">
<h3>Select Tables</h3>
<button onclick="toggleAll(true)">Select All</button>
<button onclick="toggleAll(false)">Clear All</button>
<div class="grid" id="tables"></div>

<h3>Settings</h3>
<label><input type="checkbox" id="ex1"> Exclude ×1</label>
<label><input type="checkbox" id="ex10"> Exclude ×10</label>
<label><input type="checkbox" id="adaptive" checked> Adaptive Mode</label>
<br><br>
Questions <input id="qcount" type="number" value="20" min="5" max="100">
Time/question <input id="ptime" type="number" value="10" min="3" max="60">
<br><br>
<button onclick="startGame()">▶ Start Game</button>
</div>

<div id="game" class="hidden">
<div class="stats">
<div>⭐ <span id="score">0</span></div>
<div>🔥 <span id="streak">0</span></div>
<div>⏱️ <span id="timer">0</span></div>
<div>📝 <span id="qnum">0</span>/<span id="qtotal">0</span></div>
<div>🎮 <span id="level">1</span></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div>
<input id="answer" type="number">
<button onclick="submitAnswer()">Submit</button>
<div id="feedback"></div>
<h3>🏆 Mastery</h3>
<div class="mastery" id="mastery"></div>
</div>
</div>

<script>
for(let i=1;i<=12;i++){
tables.innerHTML+=`<label><input class="tbl" type="checkbox" value="${i}" ${i>=7&&i<=9?'checked':''}>${i}</label>`;
}

let score=0,streak=0,level=1,prog=0,current=0,total=20,timePer=10,ans=0,timerH;
let currentFact="";
let missed=[];
let mastery=JSON.parse(localStorage.getItem("mm_mastery")||"{}");
let wrongs=JSON.parse(localStorage.getItem("mm_wrongs")||"{}");

function renderMastery(){
let h="";
for(let i=1;i<=12;i++){
let m=mastery[i]||0;
let s=m>=20?"⭐⭐⭐":m>=10?"⭐⭐":m>=5?"⭐":"";
h+=`<div>${i}'s<br>${s}</div>`;
}
document.getElementById("mastery").innerHTML=h;
}
renderMastery();

function toggleAll(v){document.querySelectorAll(".tbl").forEach(x=>x.checked=v);}

function selected(){return [...document.querySelectorAll(".tbl:checked")].map(x=>+x.value);}

function mult(){
let a=[];
for(let i=1;i<=12;i++){
if(i==1 && ex1.checked) continue;
if(i==10 && ex10.checked) continue;
a.push(i);
}
return a[Math.floor(Math.random()*a.length)];
}

function startGame(){
if(selected().length===0){alert("Select a table");return;}
score=0;streak=0;level=1;prog=0;current=0;missed=[];
total=+qcount.value;timePer=+ptime.value;
setup.classList.add("hidden"); game.classList.remove("hidden");
qtotal.textContent=total;
nextQ();
}

function nextQ(){
if(current>=total){endGame();return;}
current++; qnum.textContent=current;

let t,m;
if(adaptive.checked && Object.keys(wrongs).length>0 && Math.random()<0.4){
let keys=Object.keys(wrongs);
let pick=keys[Math.floor(Math.random()*keys.length)];
[t,m]=pick.split("x").map(Number);
}else{
t=selected()[Math.floor(Math.random()*selected().length)];
m=mult();
}
currentFact=t+"x"+m;
ans=t*m;
question.textContent=`${t} × ${m}`;
answer.value="";
feedback.textContent="";
startTimer();
}

function startTimer(){
clearInterval(timerH);
let t=timePer; timer.textContent=t;
timerH=setInterval(()=>{
t--; timer.textContent=t;
if(t<=0){
clearInterval(timerH);
recordWrong();
feedback.textContent="⏰ Time's up!";
setTimeout(nextQ,1000);
}
},1000);
}

function recordWrong(){
wrongs[currentFact]=(wrongs[currentFact]||0)+1;
localStorage.setItem("mm_wrongs",JSON.stringify(wrongs));
}

function submitAnswer(){
clearInterval(timerH);
if(+answer.value===ans){
streak++;
score+=10+streak;
let table=currentFact.split("x")[0];
mastery[table]=(mastery[table]||0)+1;
localStorage.setItem("mm_mastery",JSON.stringify(mastery));
feedback.textContent="✅ Correct";
prog++;
if(prog>=10){prog=0;level=Math.min(5,level+1);}
}else{
streak=0;
recordWrong();
feedback.textContent="❌ Correct answer: "+ans;
}
update();
setTimeout(nextQ,800);
}

function update(){
score.textContent=window.score;
document.getElementById("streak").textContent=streak;
document.getElementById("level").textContent=level;
bar.style.width=(prog*10)+"%";
renderMastery();
}

function endGame(){
let medal="🥉 Bronze";
if(score>=total*15) medal="🥇 Gold";
else if(score>=total*12) medal="🥈 Silver";

let weakest=Object.entries(wrongs).sort((a,b)=>b[1]-a[1]).slice(0,5)
.map(x=>x[0]+" ("+x[1]+")").join("<br>") || "None";

question.innerHTML="🎉 Finished!";
feedback.innerHTML=`<h2>${medal}</h2><h3>Score: ${score}</h3><h3>Weak Facts</h3>${weakest}<br><br><button onclick="location.reload()">Play Again</button>`;
}
answer.addEventListener("keypress",e=>{if(e.key==="Enter")submitAnswer();});
</script>
</body>
</html>
